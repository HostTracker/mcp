# Publish server.json to the official MCP registry (registry.modelcontextprotocol.io) as the HostTracker org.
#
# Uses the registry's GitHub OIDC login: the workflow's identity token carries repository_owner=HostTracker, which
# grants the io.github.HostTracker/* namespace without any personal token - the reliable path when an org's
# third-party OAuth-app policy keeps `mcp-publisher login github` from reading org membership (the "You have
# permission to publish: io.github.<user>/*" 403).
#
# Run it from the Actions tab ("Run workflow") after bumping server.json's version, or push a v* tag.
name: publish-to-mcp-registry

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      - name: Authenticate to MCP Registry (GitHub OIDC, org namespace)
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
